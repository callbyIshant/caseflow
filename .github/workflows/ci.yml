name: CaseFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caseflow
          POSTGRES_PASSWORD: caseflow
          POSTGRES_DB: caseflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caseflow -d caseflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://caseflow:caseflow@localhost:5432/caseflow
      DATABASE_URL_DIRECT: postgresql+psycopg://caseflow:caseflow@localhost:5432/caseflow
      PUBLIC_APP_URL: http://localhost:5173
      ALLOWED_ORIGIN: http://localhost:5173
      CSRF_SECRET: ci-only-secret-not-used-for-real-users-0001
      COOKIE_SECURE: "false"
      COOKIE_NAME: caseflow_dev_session
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.21"
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Apply migrations
        working-directory: backend
        run: uv run --locked alembic upgrade head
      - name: Check migration/model parity
        working-directory: backend
        run: uv run --locked alembic check
      - name: Ruff
        working-directory: backend
        run: uv run --locked ruff check app tests alembic
      - name: Mypy
        working-directory: backend
        run: uv run --locked mypy app
      - name: PostgreSQL integration tests
        working-directory: backend
        run: uv run --locked pytest
      - name: Python dependency audit
        working-directory: backend
        run: uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: npm dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Vitest
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  container:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production container
        run: docker build --tag caseflow:ci .

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, container]
    env:
      DATABASE_URL: postgresql+psycopg://caseflow:caseflow@localhost:5433/caseflow
      DATABASE_URL_DIRECT: postgresql+psycopg://caseflow:caseflow@localhost:5433/caseflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.21"
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start migrated production container stack
        run: docker compose up --build --detach app
      - name: Wait for CaseFlow
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs app migrate
          exit 1
      - name: Customer and support Playwright journey
        working-directory: frontend
        run: npm run test:e2e
      - name: Stop and discard CI database
        if: always()
        run: docker compose down --volumes
