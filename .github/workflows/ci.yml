name: CaseFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caseflow
          POSTGRES_PASSWORD: caseflow
          POSTGRES_DB: caseflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caseflow -d caseflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://caseflow:caseflow@localhost:5432/caseflow
      DATABASE_URL_DIRECT: postgresql+psycopg://caseflow:caseflow@localhost:5432/caseflow
      PUBLIC_APP_URL: http://localhost:5173
      ALLOWED_ORIGIN: http://localhost:5173
      CSRF_SECRET: ci-only-secret-not-used-for-real-users-0001
      COOKIE_SECURE: "false"
      COOKIE_NAME: caseflow_dev_session
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.21"
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Apply migrations
        working-directory: backend
        run: uv run --locked alembic upgrade head
      - name: Ruff
        working-directory: backend
        run: uv run --locked ruff check app tests alembic
      - name: Mypy
        working-directory: backend
        run: uv run --locked mypy app
      - name: PostgreSQL integration tests
        working-directory: backend
        run: uv run --locked pytest

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Vitest
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  container:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production container
        run: docker build --tag caseflow:ci .
